apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'io.base14.scoutreact'
version = '0.1.1'

buildscript {
  // Resolve buildscript classpath from the host app's repos.
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (expoModulesCorePlugin.exists()) {
    apply from: expoModulesCorePlugin
  }
}

if (project.hasProperty('applyKotlinExpoModulesCorePlugin')) {
  applyKotlinExpoModulesCorePlugin()
}

android {
  namespace 'io.base14.scoutreact'
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
    versionCode 1
    versionName "0.1.1"
  }

  buildFeatures {
    buildConfig true
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  defaultConfig {
    externalNativeBuild {
      cmake {
        // `cFlags` not `cppFlags` — the C signal-handler is pure C, and
        // passing `-std=c11` as a C++ flag breaks NDK's CXX compiler
        // detection (`invalid argument '-std=c11' not allowed with 'C++'`).
        cFlags "-std=c11"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
}
